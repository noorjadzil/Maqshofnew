<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setting Nozil Note</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:#07111f;color:white;min-height:100vh;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
a{color:white;text-decoration:none}
h1{font-size:25px}
.panel{background:#0f172a;border:1px solid #334155;border-radius:24px;padding:16px;margin-bottom:14px}
button,select,textarea{width:100%;border:0;border-radius:16px;padding:14px;margin-top:10px;font-weight:800}
button{background:#facc15;color:#111827}
.danger{background:#ef4444;color:white}
textarea{background:#020617;color:white;border:1px solid #334155;min-height:130px;font-weight:400}
.small{font-size:13px;color:#94a3b8;line-height:1.5}
.nav{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:10px}
.nav a{flex:1;text-align:center;background:#0f172a;color:white;border:1px solid #334155;border-radius:18px;padding:13px;text-decoration:none;font-weight:700}
</style>
</head>
<body>

<div class="top">
  <a href="index.html">← Kembali</a>
  <h1>Setting</h1>
</div>

<div class="panel">
  <h3>Mode Aplikasi</h3>
  <p class="small">Versi ini masih GitHub/HTML. Alarm lockscreen asli nanti diperkuat saat masuk Capacitor/APK.</p>
  <select id="mode">
    <option value="simple">Simple</option>
    <option value="premium">Premium</option>
    <option value="focus">Focus Note</option>
  </select>
  <button onclick="saveSetting()">Simpan Setting</button>
</div>

<div class="panel">
  <h3>Backup Data</h3>
  <p class="small">Salin data ini untuk backup catatan.</p>
  <button onclick="exportData()">Export Backup</button>
  <textarea id="backup" placeholder="Data backup akan muncul di sini"></textarea>
</div>

<div class="panel">
  <h3>Restore Data</h3>
  <p class="small">Tempel data backup lalu tekan Restore.</p>
  <button onclick="restoreData()">Restore Backup</button>
</div>

<div class="panel">
  <h3>Reset</h3>
  <p class="small">Hapus semua catatan dari browser ini.</p>
  <button class="danger" onclick="resetData()">Hapus Semua Catatan</button>
</div>

<div class="nav">
  <a href="index.html">Catatan</a>
  <a href="setting.html">Setting</a>
</div>

<script>
const NOTE_KEY="nozil_notes_v1";
const SET_KEY="nozil_setting_v1";

function saveSetting(){
  localStorage.setItem(SET_KEY,JSON.stringify({
    mode:document.getElementById("mode").value
  }));
  alert("Setting tersimpan");
}

function loadSetting(){
  const s=JSON.parse(localStorage.getItem(SET_KEY)||"{}");
  if(s.mode) document.getElementById("mode").value=s.mode;
}

function exportData(){
  const data={
    notes:JSON.parse(localStorage.getItem(NOTE_KEY)||"[]"),
    setting:JSON.parse(localStorage.getItem(SET_KEY)||"{}"),
    exportedAt:new Date().toISOString()
  };
  document.getElementById("backup").value=JSON.stringify(data,null,2);
}

function restoreData(){
  try{
    const data=JSON.parse(document.getElementById("backup").value);
    if(data.notes) localStorage.setItem(NOTE_KEY,JSON.stringify(data.notes));
    if(data.setting) localStorage.setItem(SET_KEY,JSON.stringify(data.setting));
    alert("Restore berhasil");
  }catch(e){
    alert("Data backup tidak valid");
  }
}

function resetData(){
  if(confirm("Yakin hapus semua catatan?")){
    localStorage.removeItem(NOTE_KEY);
    alert("Semua catatan dihapus");
  }
}

loadSetting();
</script>

</body>
</html>
