<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Nozil Editor</title>
<style>
body{margin:0}
iframe{width:100vw;height:100vh;border:0}
#editor{display:none;position:fixed;z-index:99999;background:#0f172a;color:#fff;
padding:12px;border-radius:12px;width:320px;border:1px solid #334155}
input{width:100%} .row{display:flex;gap:6px;margin-top:6px} button{flex:1}
#back{position:fixed;top:10px;left:10px;z-index:9999}
</style></head><body>
<button id="back" onclick="location.href='index.html'">← Kembali</button>
<iframe id="frame" src="index.html"></iframe>

<div id="editor">
<div id="lbl">Editor</div>
<input id="txt" placeholder="Teks">
<div class="row">
<input id="fg" type="color">
<input id="bg" type="color">
</div>
<div class="row">
<button onclick="resetEl()">Reset</button>
<button onclick="saveEl()">Simpan</button>
</div>
</div>

<script>
let selected=null,backup='';

frame.onload=()=>{
 const d=frame.contentWindow.document;
 d.addEventListener('click',e=>{
   e.preventDefault();e.stopPropagation();
   if(selected) selected.style.outline='';
   selected=e.target;
   backup=selected.style.cssText;
   selected.style.outline='2px solid #3b82f6';

   const r=selected.getBoundingClientRect();
   editor.style.display='block';
   editor.style.left=r.left+'px';
   editor.style.top=(r.bottom+8)+'px';

   txt.value=selected.textContent||'';
   lbl.textContent='Edit '+selected.tagName.toLowerCase();
 },true);
};

function makeSelector(el){
 if(el.id) return '#'+el.id;
 if(el.className && typeof el.className==='string'){
   let c=el.className.trim().split(' ')[0];
   if(c) return '.'+c;
 }
 return el.tagName.toLowerCase();
}

txt.oninput=()=>{ if(selected) selected.textContent=txt.value; };
fg.oninput=()=>{ if(selected) selected.style.color=fg.value; };
bg.oninput=()=>{ if(selected) selected.style.background=bg.value; };

function saveEl(){
 if(!selected) return;
 const sel=makeSelector(selected);
 const theme=JSON.parse(localStorage.getItem('nozil_theme')||'{}');
 theme[sel]={
   style:selected.style.cssText,
   text:selected.textContent
 };
 localStorage.setItem('nozil_theme',JSON.stringify(theme));

 // langsung update preview
 frame.contentWindow.location.reload();

 alert('Tersimpan & diterapkan ke index');
}

function resetEl(){
 if(selected) selected.style.cssText=backup;
}
</script>
</body></html>
