<!DOCTYPE html>
<html>
<head>
  <title>Setting Avatar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:Arial;text-align:center;">

<h2>Pilih Avatar</h2>

<img src="https://via.placeholder.com/100?text=A" style="margin:10px;cursor:pointer;" onclick="pilih('https://via.placeholder.com/100?text=A')">
<img src="https://via.placeholder.com/100?text=B" style="margin:10px;cursor:pointer;" onclick="pilih('https://via.placeholder.com/100?text=B')">
<img src="https://via.placeholder.com/100?text=C" style="margin:10px;cursor:pointer;" onclick="pilih('https://via.placeholder.com/100?text=C')">

<br><br>

<button onclick="simpan()" style="padding:10px 20px;">Simpan</button>

<p id="status"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGgPaeVEkv3U0pLU0eyB0gww69Cm_yAK0",
  authDomain: "bahasa-arab-90f36.firebaseapp.com",
  projectId: "bahasa-arab-90f36",
  databaseURL: "https://bahasa-arab-90f36-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let pilihan = "";

window.pilih = function(url){
  pilihan = url;
  document.getElementById("status").innerText = "Dipilih";
}

window.simpan = function(){
  if(pilihan===""){
    alert("Pilih dulu!");
    return;
  }

  set(ref(db, "setting/avatar"), {
    url: pilihan
  });

  document.getElementById("status").innerText = "Tersimpan!";
}
</script>

</body>
</html>
