<!DOCTYPE html><html><head><meta charset='utf-8'><title>Nozil Settings</title>
<style>
body{margin:0;font-family:Arial;height:100vh;display:flex}
#left{width:340px;padding:15px;background:#111827;color:#fff}
#right{flex:1}
input{width:100%;margin:6px 0;height:40px}
iframe{width:100%;height:100%;border:none}
</style></head><body>
<div id='left'>
<h2>Nozil Theme Builder</h2>
<label>Background</label><input type='color' id='bg' value='#07111f'>
<label>Card</label><input type='color' id='card' value='#0f172a'>
<label>Text</label><input type='color' id='text' value='#ffffff'>
<button onclick='saveTheme()'>Simpan</button>
</div>
<div id='right'><iframe id='preview' src='index.html'></iframe></div>
<script>
function saveTheme(){
 const t={bg:bg.value,card:card.value,text:text.value};
 localStorage.setItem('nozil_theme',JSON.stringify(t));
 document.getElementById('preview').contentWindow.location.reload();
}
</script></body></html>
