<!DOCTYPE html>
<html>
<head>
<title>Setting</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f4f6f9;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  max-width: 500px;
  margin: auto;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

button {
  padding: 10px;
  width: 100%;
  background: #2d89ff;
  color: white;
  border: none;
}
</style>

</head>
<body>

<div class="card">
<h2>Setting Tema</h2>

<label>Font</label>
<select id="font">
  <option>Arial</option>
  <option>Verdana</option>
  <option>Tahoma</option>
</select>

<label>Warna Background</label>
<input type="color" id="bg">

<label>Warna Teks</label>
<input type="color" id="text">

<label>Warna Utama (Header)</label>
<input type="color" id="primary">

<button onclick="simpan()">Simpan</button>
<button onclick="kembali()">Kembali</button>

</div>

<script>
function simpan(){
  const setting = {
    font: document.getElementById("font").value,
    bg: document.getElementById("bg").value,
    text: document.getElementById("text").value,
    primary: document.getElementById("primary").value
  };

  localStorage.setItem("setting", JSON.stringify(setting));
  alert("Tersimpan!");
}

function kembali(){
  window.location = "index.html";
}
</script>

</body>
</html>
