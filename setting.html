<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Nozil Visual Editor Pro</title>
<style>
body{margin:0;background:#111827;font-family:Segoe UI;color:#fff}
#top{padding:12px;background:#1f2937}
#frame{width:100%;height:calc(100vh - 220px);border:0}
#sheet{position:fixed;left:0;right:0;bottom:0;height:220px;background:#0f172a;border-top:2px solid #334155;padding:12px;overflow:auto}
.row{display:flex;gap:10px;margin:8px 0}
input{flex:1}
button{padding:8px 14px}
</style></head>
<body>
<div id="top">Nozil Visual Editor Pro</div>
<iframe id="frame" src="index.html"></iframe>

<div id="sheet">
<b>Element Editor</b>
<div id="selected">Belum ada elemen dipilih</div>
<div class="row"><input id="txt" placeholder="Teks"></div>
<div class="row">
<input id="textColor" type="color">
<input id="bgColor" type="color">
</div>
<div class="row">
<button onclick="save()">Simpan</button>
<button onclick="resetEl()">Reset</button>
</div>
</div>

<script>
let el=null,old='';

frame.onload=()=>{
 const d=frame.contentWindow.document;
 d.addEventListener('click',e=>{
   e.preventDefault();
   e.stopPropagation();
   if(el) el.style.outline='';
   el=e.target;
   old=el.getAttribute('style')||'';
   el.style.outline='2px solid #3b82f6';
   selected.innerText='Dipilih: '+el.tagName;
   txt.value=el.innerText||'';
 },true);
};

txt.oninput=()=>{ if(el) el.innerText=txt.value; };
textColor.oninput=()=>{ if(el) el.style.color=textColor.value; };
bgColor.oninput=()=>{ if(el) el.style.background=bgColor.value; };

function save(){ alert('Perubahan disimpan'); }
function resetEl(){ if(el) el.setAttribute('style',old); }
</script>
</body></html>
