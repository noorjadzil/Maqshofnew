<!DOCTYPE html><html><head><meta charset='utf-8'><title>Nozil Builder Studio</title>
<style>
body{margin:0;height:100vh;display:grid;grid-template-columns:260px 340px 1fr;font-family:Segoe UI;background:#0b1220;color:#fff}
.sidebar,.props{background:#111827;padding:16px;overflow:auto}.props{border-left:1px solid #334155}
.layer{padding:10px;border-radius:10px;background:#0f172a;margin:6px 0;cursor:pointer}
iframe{width:100%;height:100%;border:none}
input{width:100%}
.top{font-weight:bold;margin-bottom:10px}
</style></head><body>
<div class='sidebar'><div class='top'>Layers</div>
<div class='layer'>Header</div><div class='layer'>Search</div><div class='layer'>Folder</div><div class='layer'>Card</div></div>
<div class='props'><div class='top'>Inspector</div>
<label>Radius</label><input type='range' min='0' max='50' id='radius'>
<label>Shadow</label><input type='range' min='0' max='50' id='shadow'>
<button onclick='localStorage.removeItem("nozil_theme")'>Reset</button>
</div>
<div><iframe src='index.html'></iframe></div></body></html>
