<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setting 5 - Premium Studio</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Setting 5 — Premium Studio</h1><p>Konsep studio: panel bisnis, item, stok, dan barang kurang.</p></header><main class="wrap"><div class="grid" style="grid-template-columns:.8fr 1.2fr"><aside class="card"><h2>Profil Bisnis</h2><label>Nama</label><input id="brand"><label>WA</label><input id="wa"><button class="green" onclick="save()">Simpan Semua</button><button class="red" onclick="resetAll()">Reset</button></aside><section id="area"></section></div></main><div id="nav"></div><script src="db.js"></script><script>
let S; window.onload=async()=>{S=await getSettings(); document.getElementById('nav').innerHTML=nav('setting').replaceAll('Input2','Input5').replaceAll('laporan2','laporan5').replaceAll('setting2','setting5'); brand.value=S.brand; wa.value=S.wa||''; render()};
function render(){area.innerHTML=['produk','extra','minuman'].map(k=>`<div class="card"><div class="section-title"><h2>${k}</h2><button class="soft mini" onclick="add('${k}')">Tambah</button></div><div class="grid">${S[k].map((x,i)=>`<div style="background:linear-gradient(180deg,#fff,#f8fafc);border:1px solid var(--line);border-radius:18px;padding:12px"><input id="${k}_n_${i}" value="${x.nama}"><input id="${k}_h_${i}" type="number" value="${x.harga}"><label class="pill"><input id="${k}_a_${i}" type="checkbox" ${x.aktif!==false?'checked':''} style="width:auto"> Aktif</label></div>`).join('')}</div></div>`).join('')+`<div class="card"><h2>Stok & Cek Barang</h2><textarea id="stok" rows="5">${(S.stok||[]).join('\n')}</textarea><textarea id="cek" rows="5">${(S.cekBarang||[]).join('\n')}</textarea></div>`}
function add(k){S[k].push({nama:'Menu Baru',harga:0,aktif:true});render()} async function save(){S.brand=brand.value;S.wa=wa.value; ['produk','extra','minuman'].forEach(k=>S[k]=S[k].map((x,i)=>({nama:document.getElementById(`${k}_n_${i}`).value,harga:Number(document.getElementById(`${k}_h_${i}`).value||0),aktif:document.getElementById(`${k}_a_${i}`).checked}))); S.stok=stok.value.split('\n').map(x=>x.trim()).filter(Boolean); S.cekBarang=cek.value.split('\n').map(x=>x.trim()).filter(Boolean); await saveSettings(S);alert('Tersimpan')} async function resetAll(){if(confirm('Reset semua setting?')){S=await resetSettings();brand.value=S.brand;wa.value=S.wa||'';render()}}
</script></body></html>
