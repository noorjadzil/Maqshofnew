<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan 5 - Executive</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Laporan 5 — Executive Summary</h1><p>Konsep premium: ringkasan besar dan daftar transaksi bersih.</p></header><main class="wrap"><div class="grid"><div class="card"><label>Pilih bulan</label><input type="month" id="bulan" onchange="load()"></div><div class="card"><span class="pill">Total omzet</span><div class="total" id="total">Rp 0</div></div><div class="card"><span class="pill">Rata-rata/laporan</span><div class="total" id="avg">Rp 0</div></div></div><div class="card"><h2>Timeline Laporan</h2><div id="timeline"></div></div></main><div id="nav"></div><script src="db.js"></script><script>
let S,R=[]; window.onload=async()=>{S=await getSettings(); bulan.value=today().slice(0,7); document.getElementById('nav').innerHTML=nav('laporan').replaceAll('Input2','Input5').replaceAll('laporan2','laporan5').replaceAll('setting2','setting5'); load()};
async function load(){R=(await getAllReports()).filter(x=>(x.tanggal||'').startsWith(bulan.value)); let t=R.reduce((a,b)=>a+(b.total||0),0); total.textContent=rupiah(t); avg.textContent=rupiah(R.length?t/R.length:0); timeline.innerHTML=R.map(x=>`<div style="border-left:4px solid #1e3a8a;padding:0 0 18px 14px;margin-left:6px"><span class="pill">${x.tanggal}</span><h3>${rupiah(x.total)}</h3><p class="muted">${x.konsep||''} ${x.catatan||''}</p><button class="soft mini" onclick='openWA(${JSON.stringify(x)},S)'>WhatsApp</button></div>`).join('') || 'Belum ada data.'}
</script></body></html>
