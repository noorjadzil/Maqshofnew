<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan 2 - Kartu Harian</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Laporan 2 — Kartu Harian & Bulanan</h1><p>Konsep kartu: mudah dibaca di HP.</p></header><main class="wrap"><div class="card row"><input type="date" id="tgl"><input type="month" id="bln"><button class="primary" onclick="load()">Tampilkan</button></div><div id="summary" class="grid"></div><div id="list"></div></main><div id="nav"></div><script src="db.js"></script><script>
let S,R=[]; window.onload=async()=>{S=await getSettings(); tgl.value=today(); bln.value=today().slice(0,7); document.getElementById('nav').innerHTML=nav('laporan'); load()};
async function load(){R=await getAllReports(); let harian=R.filter(x=>x.tanggal===tgl.value); let bulanan=R.filter(x=>(x.tanggal||'').startsWith(bln.value)); const totH=harian.reduce((a,b)=>a+(b.total||0),0), totB=bulanan.reduce((a,b)=>a+(b.total||0),0); summary.innerHTML=`<div class="card"><span class="pill">Harian</span><div class="total">${rupiah(totH)}</div><p>${harian.length} laporan</p></div><div class="card"><span class="pill">Bulanan ${bulanNama(bln.value)}</span><div class="total">${rupiah(totB)}</div><p>${bulanan.length} laporan</p></div>`; list.innerHTML=harian.concat(bulanan.filter(x=>x.tanggal!==tgl.value)).map(card).join('') || '<div class="card">Belum ada data.</div>'}
function card(x){return `<div class="card"><div class="section-title"><div><b>${x.tanggal}</b><p class="muted">${x.konsep||''} ${x.catatan||''}</p></div><b>${rupiah(x.total)}</b></div><button class="soft mini" onclick='wa(${JSON.stringify(x.id)})'>WA</button><button class="red mini" onclick='del(${JSON.stringify(x.id)})'>Hapus</button></div>`}
async function del(id){if(confirm('Hapus laporan?')){await deleteReport(id);load()}} function wa(id){openWA(R.find(x=>x.id===id),S)}
</script></body></html>
