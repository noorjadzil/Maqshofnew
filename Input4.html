<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input 4 - Spreadsheet</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Input 4 — Tabel Spreadsheet</h1><p>Konsep padat: semua item tampak seperti lembar kerja.</p></header><main class="wrap"><div class="card"><div class="row"><input type="date" id="tanggal"><input id="operator" placeholder="Nama operator"><input id="catatan" placeholder="Catatan"></div></div><div class="card"><table><thead><tr><th>Kategori</th><th>Item</th><th>Harga</th><th>Jumlah</th><th>Subtotal</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="card section-title"><div><b>Total</b><div class="total" id="total">Rp 0</div></div><div><button class="green" onclick="simpanLaporan()">Simpan</button><button class="soft" onclick="kirim()">WA</button></div></div></main><div id="nav"></div><script src="db.js"></script><script>
let S, rows=[]; window.onload=async()=>{S=await getSettings(); tanggal.value=today(); document.getElementById('nav').innerHTML=nav('input').replaceAll('Input2','Input4').replaceAll('laporan2','laporan4').replaceAll('setting2','setting4'); render();};
function render(){rows=[]; ['produk','extra','minuman'].forEach(k=>activeItems(S,k).forEach(x=>rows.push({k,...x}))); tbody.innerHTML=rows.map((x,i)=>`<tr><td>${x.k}</td><td>${x.nama}</td><td>${rupiah(x.harga)}</td><td><input type="number" min="0" id="j_${i}" value="0" oninput="hitung()"></td><td id="s_${i}">Rp 0</td></tr>`).join(''); hitung()}
function kumpul(){let data={tanggal:tanggal.value,operator:operator.value,catatan:catatan.value,konsep:'Input4',produk:[],extra:[],minuman:[],stok:[],cekBarang:[]}; rows.forEach((r,i)=>data[r.k].push({nama:r.nama,harga:r.harga,jumlah:Number(document.getElementById(`j_${i}`).value||0),aktif:r.aktif})); return calcReport(data)}
function hitung(){let sum=0; rows.forEach((r,i)=>{let sub=Number(document.getElementById(`j_${i}`).value||0)*r.harga; sum+=sub; document.getElementById(`s_${i}`).textContent=rupiah(sub)}); total.innerText=rupiah(sum)} async function simpanLaporan(){await saveReport(kumpul()); alert('Tersimpan')} function kirim(){openWA(kumpul(),S)}
</script></body></html>
