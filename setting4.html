<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setting 4 - Spreadsheet</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Setting 4 — Spreadsheet Editor</h1><p>Konsep tabel cepat untuk edit banyak item sekaligus.</p></header><main class="wrap"><div class="card row"><input id="brand"><input id="wa"><button class="green" onclick="save()">Simpan</button></div><div class="card"><table><thead><tr><th>Kategori</th><th>Nama</th><th>Harga</th><th>Aktif</th></tr></thead><tbody id="tb"></tbody></table><button class="soft" onclick="addRow()">Tambah Baris</button></div></main><div id="nav"></div><script src="db.js"></script><script>
let S, rows=[]; window.onload=async()=>{S=await getSettings(); document.getElementById('nav').innerHTML=nav('setting').replaceAll('Input2','Input4').replaceAll('laporan2','laporan4').replaceAll('setting2','setting4'); brand.value=S.brand; wa.value=S.wa||''; rows=[]; ['produk','extra','minuman'].forEach(k=>S[k].forEach(x=>rows.push({k,...x}))); render()};
function render(){tb.innerHTML=rows.map((x,i)=>`<tr><td><select id="k_${i}"><option ${x.k==='produk'?'selected':''}>produk</option><option ${x.k==='extra'?'selected':''}>extra</option><option ${x.k==='minuman'?'selected':''}>minuman</option></select></td><td><input id="n_${i}" value="${x.nama}"></td><td><input id="h_${i}" type="number" value="${x.harga}"></td><td><input id="a_${i}" type="checkbox" ${x.aktif!==false?'checked':''}></td></tr>`).join('')}
function addRow(){rows.push({k:'produk',nama:'Item Baru',harga:0,aktif:true});render()} async function save(){S.brand=brand.value;S.wa=wa.value; S.produk=[];S.extra=[];S.minuman=[]; rows.forEach((_,i)=>S[document.getElementById(`k_${i}`).value].push({nama:document.getElementById(`n_${i}`).value,harga:Number(document.getElementById(`h_${i}`).value||0),aktif:document.getElementById(`a_${i}`).checked})); await saveSettings(S);alert('Tersimpan')}
</script></body></html>
