<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan 3 - Ranking</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Laporan 3 — Ranking Penjualan</h1><p>Konsep analisa: item paling laku dan total bulanan.</p></header><main class="wrap"><div class="card row"><input type="month" id="bulan"><button class="primary" onclick="load()">Analisa</button><button class="red" onclick="hapusBulan()">Hapus Bulan Ini</button></div><div id="sum" class="grid"></div><div class="card"><table><thead><tr><th>Rank</th><th>Item</th><th>Qty</th><th>Total Uang</th></tr></thead><tbody id="rank"></tbody></table></div></main><div id="nav"></div><script src="db.js"></script><script>
let S,R=[]; window.onload=async()=>{S=await getSettings(); bulan.value=today().slice(0,7); document.getElementById('nav').innerHTML=nav('laporan').replaceAll('Input2','Input3').replaceAll('laporan2','laporan3').replaceAll('setting2','setting3'); load()};
async function load(){R=(await getAllReports()).filter(x=>(x.tanggal||'').startsWith(bulan.value)); let map={}; R.forEach(r=>['produk','extra','minuman'].forEach(k=>(r[k]||[]).forEach(i=>{if(!map[i.nama])map[i.nama]={qty:0,total:0}; map[i.nama].qty+=Number(i.jumlah||0); map[i.nama].total+=Number(i.jumlah||0)*Number(i.harga||0)}))); let arr=Object.entries(map).map(([nama,v])=>({nama,...v})).sort((a,b)=>b.total-a.total); sum.innerHTML=`<div class="card"><span class="pill">Total bulan</span><div class="total">${rupiah(R.reduce((a,b)=>a+(b.total||0),0))}</div></div><div class="card"><span class="pill">Jumlah laporan</span><div class="total">${R.length}</div></div><div class="card"><span class="pill">Item terlaris</span><h2>${arr[0]?.nama||'-'}</h2></div>`; rank.innerHTML=arr.map((x,i)=>`<tr><td>${i+1}</td><td>${x.nama}</td><td>${x.qty}</td><td>${rupiah(x.total)}</td></tr>`).join('') || '<tr><td colspan="4">Belum ada data</td></tr>'}
async function hapusBulan(){if(confirm('Hapus semua laporan bulan ini?')){for(const r of R) await deleteReport(r.id); load()}}
</script></body></html>
