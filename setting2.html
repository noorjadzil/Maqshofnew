<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setting 2 - Form Sederhana</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Setting 2 — Form Sederhana</h1><p>Edit brand, nomor WA, dan item dengan form per kategori.</p></header><main class="wrap"><div id="area"></div></main><div id="nav"></div><script src="db.js"></script><script>
let S; window.onload=async()=>{S=await getSettings(); document.getElementById('nav').innerHTML=nav('setting'); render()};
function render(){area.innerHTML=`<div class="card"><label>Nama Usaha</label><input id="brand" value="${S.brand}"><label>Nomor WA Tujuan</label><input id="wa" value="${S.wa||''}"></div>`+['produk','extra','minuman'].map(k=>`<div class="card"><div class="section-title"><h2>${k}</h2><button class="soft mini" onclick="add('${k}')">Tambah</button></div><div id="${k}">${(S[k]||[]).map((x,i)=>row(k,x,i)).join('')}</div></div>`).join('')+`<div class="card"><button class="green" onclick="save()">Simpan Setting</button><button class="red" onclick="resetAll()">Reset Default</button></div>`}
function row(k,x,i){return `<div class="row"><input id="${k}_n_${i}" value="${x.nama}"><input id="${k}_h_${i}" type="number" value="${x.harga}"><select id="${k}_a_${i}"><option value="true" ${x.aktif!==false?'selected':''}>Aktif</option><option value="false" ${x.aktif===false?'selected':''}>Nonaktif</option></select></div>`}
function add(k){S[k].push({nama:'Item Baru',harga:0,aktif:true}); render()} async function save(){S.brand=brand.value;S.wa=wa.value; ['produk','extra','minuman'].forEach(k=>S[k]=S[k].map((x,i)=>({nama:document.getElementById(`${k}_n_${i}`).value,harga:Number(document.getElementById(`${k}_h_${i}`).value||0),aktif:document.getElementById(`${k}_a_${i}`).value==='true'}))); await saveSettings(S); alert('Setting tersimpan')} async function resetAll(){if(confirm('Reset setting?')){S=await resetSettings();render()}}
</script></body></html>
