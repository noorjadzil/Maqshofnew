<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan 4 - Tabel Kalender</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Laporan 4 — Kalender Bulanan</h1><p>Konsep tabel tanggal 1–31 seperti rekap bisnis.</p></header><main class="wrap"><div class="card row"><input type="month" id="bulan"><button class="primary" onclick="load()">Buka Bulan</button></div><div class="card" style="overflow:auto"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></main><div id="nav"></div><script src="db.js"></script><script>
let S; window.onload=async()=>{S=await getSettings(); bulan.value=today().slice(0,7); document.getElementById('nav').innerHTML=nav('laporan').replaceAll('Input2','Input4').replaceAll('laporan2','laporan4').replaceAll('setting2','setting4'); load()};
async function load(){let R=(await getAllReports()).filter(x=>(x.tanggal||'').startsWith(bulan.value)); let days=new Date(Number(bulan.value.slice(0,4)),Number(bulan.value.slice(5,7)),0).getDate(); head.innerHTML='<tr><th>Item</th>'+Array.from({length:days},(_,i)=>`<th>${i+1}</th>`).join('')+'<th>Total Qty</th><th>Total Uang</th></tr>'; let items=[...activeItems(S,'produk'),...activeItems(S,'extra'),...activeItems(S,'minuman')]; body.innerHTML=items.map(item=>{let tq=0,tu=0; let cols=Array.from({length:days},(_,d)=>{let q=0; R.filter(r=>Number((r.tanggal||'').slice(8,10))===d+1).forEach(r=>['produk','extra','minuman'].forEach(k=>(r[k]||[]).filter(x=>x.nama===item.nama).forEach(x=>q+=Number(x.jumlah||0)))); tq+=q; tu+=q*item.harga; return `<td>${q||''}</td>`}).join(''); return `<tr><td><b>${item.nama}</b></td>${cols}<td>${tq}</td><td>${rupiah(tu)}</td></tr>`}).join('')}
</script></body></html>
