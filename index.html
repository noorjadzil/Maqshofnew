<!DOCTYPE html>
<html>
<head>
  <title>Belajar Arab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:Arial;text-align:center;">

<h2>Avatar Kamu</h2>

<img id="avatar" width="120">

<br><br>

<a href="setting.html">Ganti Avatar</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGgPaeVEkv3U0pLU0eyB0gww69Cm_yAK0",
  authDomain: "bahasa-arab-90f36.firebaseapp.com",
  projectId: "bahasa-arab-90f36",
  databaseURL: "https://bahasa-arab-90f36-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, "setting/avatar"), (snapshot)=>{
  const data = snapshot.val();
  if(data){
    document.getElementById("avatar").src = data.url;
  }
});
</script>

</body>
</html>
