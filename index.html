<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nozil Note</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:#07111f;color:white;min-height:100vh;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:26px;font-weight:800}
.logo span{color:#facc15}
.btn{border:0;border-radius:16px;padding:12px 16px;background:#facc15;color:#111827;font-weight:800;text-decoration:none}
.search{width:100%;padding:15px;border-radius:18px;border:1px solid #334155;background:#0f172a;color:white;margin-bottom:16px}
.grid{display:grid;gap:14px}
.card{padding:16px;border-radius:22px;background:linear-gradient(135deg,#1e293b,#0f172a);box-shadow:0 12px 30px #0007;border:1px solid #334155}
.card h3{font-size:19px;margin-bottom:8px}
.card p{color:#cbd5e1;white-space:pre-wrap;line-height:1.5}
.meta{margin-top:12px;font-size:12px;color:#94a3b8;display:flex;justify-content:space-between}
.actions{display:flex;gap:8px;margin-top:12px}
.actions a,.actions button{flex:1;border:0;border-radius:12px;padding:10px;text-align:center;text-decoration:none;font-weight:700}
.edit{background:#38bdf8;color:#082f49}
.del{background:#ef4444;color:white}
.nav{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:10px}
.nav a{flex:1;text-align:center;background:#0f172a;color:white;border:1px solid #334155;border-radius:18px;padding:13px;text-decoration:none;font-weight:700}
.empty{text-align:center;margin-top:70px;color:#94a3b8}
.pin{color:#facc15}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Nozil <span>Note</span></div>
  <a class="btn" href="catatan.html">+ Catatan</a>
</div>

<input class="search" id="search" placeholder="Cari catatan...">

<div id="list" class="grid"></div>

<div class="nav">
  <a href="index.html">Catatan</a>
  <a href="setting.html">Setting</a>
</div>

<script>
const KEY="nozil_notes_v1";
const list=document.getElementById("list");
const search=document.getElementById("search");

function getNotes(){
  return JSON.parse(localStorage.getItem(KEY)||"[]");
}

function saveNotes(data){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function hapus(id){
  if(confirm("Hapus catatan ini?")){
    saveNotes(getNotes().filter(n=>n.id!==id));
    render();
  }
}

function render(){
  const q=search.value.toLowerCase();
  let notes=getNotes().filter(n=>
    (n.title||"").toLowerCase().includes(q) ||
    (n.body||"").toLowerCase().includes(q)
  );

  notes.sort((a,b)=>(b.pin===true)-(a.pin===true) || (b.updated||0)-(a.updated||0));

  if(notes.length===0){
    list.innerHTML='<div class="empty">Belum ada catatan.<br>Tekan + Catatan untuk mulai.</div>';
    return;
  }

  list.innerHTML=notes.map(n=>`
    <div class="card" style="${n.bgStyle||''}">
      <h3>${n.pin?'📌 ':''}${n.title||'Tanpa Judul'}</h3>
      <p>${(n.body||'').slice(0,160)}</p>
      <div class="meta">
        <span>${n.alarmActive?'⏰ '+(n.alarmTime||'Alarm aktif'):'Catatan'}</span>
        <span>${new Date(n.updated||Date.now()).toLocaleDateString('id-ID')}</span>
      </div>
      <div class="actions">
        <a class="edit" href="catatan.html?id=${n.id}">Edit</a>
        <button class="del" onclick="hapus('${n.id}')">Hapus</button>
      </div>
    </div>
  `).join("");
}

search.oninput=render;
render();
</script>

</body>
</html>
