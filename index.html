<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>MAQSHOF</title>

<style>
:root{
  --bg:#f4f8ff;
  --dark:#07111f;
  --navy:#0f172a;
  --blue:#2563eb;
  --cyan:#38bdf8;
  --white:#fff;
  --muted:#64748b;
  --line:#e2e8f0;
  --shadow:0 18px 50px rgba(15,23,42,.12);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(37,99,235,.20), transparent 30%),
    radial-gradient(circle at top right, rgba(56,189,248,.20), transparent 30%),
    linear-gradient(180deg,#f8fbff 0%,var(--bg) 100%);
  color:var(--navy);
  min-height:100vh;
  padding-bottom:95px;
}

.top{
  background:
    radial-gradient(circle at 90% 0%, rgba(56,189,248,.40), transparent 30%),
    linear-gradient(135deg,#07111f 0%,#0f172a 45%,#1d4ed8 100%);
  color:white;
  padding:20px 16px 18px;
  border-bottom-left-radius:32px;
  border-bottom-right-radius:32px;
  box-shadow:0 20px 50px rgba(15,23,42,.28);
}

.top-inner{
  max-width:950px;
  margin:auto;
}

.top-row{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:flex-start;
}

.kicker{
  margin:0 0 6px;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#bfdbfe;
  font-weight:900;
}

#title{
  margin:0;
  font-size:30px;
  letter-spacing:-.05em;
  font-weight:950;
}

#desc{
  margin:8px 0 0;
  color:#dbeafe;
  font-size:13px;
  line-height:1.4;
}

.logo{
  width:58px;
  height:58px;
  border-radius:22px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.26);
  font-size:26px;
  font-weight:950;
}

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px;
}

.quick div{
  padding:11px;
  border-radius:18px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
}

.quick span{
  display:block;
  color:#bfdbfe;
  font-size:10px;
  margin-bottom:4px;
}

.quick b{
  font-size:12px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:16px 14px 0;
}

.page{
  display:none;
  animation:fade .2s ease;
}

.page.active{
  display:block;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card{
  background:rgba(255,255,255,.96);
  border-radius:26px;
  border:1px solid rgba(226,232,240,.95);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:14px;
}

.card h2{
  margin:0 0 12px;
  font-size:19px;
  font-weight:950;
  letter-spacing:-.03em;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
  font-size:13px;
  font-weight:900;
  color:#334155;
}

input,textarea{
  width:100%;
  border:1px solid #dbe4f0;
  background:#f8fafc;
  border-radius:18px;
  padding:14px;
  font-size:15px;
  outline:none;
}

input:focus,textarea:focus{
  border-color:#60a5fa;
  background:white;
  box-shadow:0 0 0 4px rgba(96,165,250,.18);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.item{
  display:grid;
  grid-template-columns:1.4fr .8fr .8fr;
  gap:10px;
  align-items:end;
  padding:12px;
  border-radius:22px;
  border:1px solid #e2e8f0;
  background:linear-gradient(180deg,#fff,#f8fafc);
  margin-bottom:11px;
}

.item small{
  color:var(--muted);
}

.category{
  background:linear-gradient(135deg,#e0f2fe,#dbeafe);
  color:#1e3a8a;
  border-radius:18px;
  padding:13px;
  font-weight:950;
  margin:18px 0 12px;
}

.total{
  border-radius:24px;
  padding:18px;
  font-size:28px;
  text-align:center;
  font-weight:950;
  background:
    radial-gradient(circle at 90% 0%, rgba(56,189,248,.28), transparent 35%),
    linear-gradient(135deg,#ecfeff,#eff6ff);
  border:1px solid #bae6fd;
}

button{
  width:100%;
  border:0;
  border-radius:18px;
  padding:14px;
  font-size:15px;
  font-weight:950;
  margin-top:10px;
}

.primary{
  background:linear-gradient(135deg,#0f172a,#2563eb);
  color:white;
}

.green{
  background:linear-gradient(135deg,#047857,#16a34a);
  color:white;
}

.red{
  background:linear-gradient(135deg,#991b1b,#dc2626);
  color:white;
}

.gray{
  background:#e2e8f0;
  color:#0f172a;
}

.nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:99;
  max-width:620px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:8px;
  border-radius:28px;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(203,213,225,.88);
  box-shadow:0 20px 55px rgba(15,23,42,.22);
  backdrop-filter:blur(22px);
}

.nav button{
  margin:0;
  padding:10px 4px;
  background:transparent;
  color:#64748b;
  border-radius:21px;
  font-size:11px;
  display:grid;
  place-items:center;
  gap:4px;
}

.nav button.active{
  background:linear-gradient(135deg,#0f172a,#2563eb);
  color:white;
  box-shadow:0 12px 28px rgba(37,99,235,.34);
}

.ico{
  width:30px;
  height:30px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:#eef2ff;
  color:#1e3a8a;
  font-size:17px;
}

.nav button.active .ico{
  background:rgba(255,255,255,.18);
  color:white;
}

@media(max-width:640px){
  .item{
    grid-template-columns:1fr;
  }

  #title{
    font-size:27px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="top-inner">

    <div class="top-row">
      <div>
        <p class="kicker">MAQSHOF SYSTEM</p>
        <h1 id="title">Input Laporan</h1>
        <p id="desc">Catat penjualan harian dengan cepat dan profesional.</p>
      </div>

      <div class="logo">M</div>
    </div>

    <div class="quick">
      <div>
        <span>Mode</span>
        <b>Offline</b>
      </div>

      <div>
        <span>Storage</span>
        <b>IndexedDB</b>
      </div>

      <div>
        <span>Status</span>
        <b>Siap</b>
      </div>
    </div>

  </div>
</header>

<div class="container">

  <!-- INPUT -->
  <section class="page active" id="inputPage">

    <div class="card">
      <h2>Input Laporan</h2>

      <label>Tanggal</label>
      <input type="date">

      <label>Catatan</label>
      <textarea placeholder="Tambahkan catatan..."></textarea>
    </div>

    <div class="card">
      <h2>Daftar Item</h2>

      <div class="category">Bubur</div>

      <div class="item">
        <div>
          <b>Bubur Ori</b><br>
          <small>Rp 7.000</small>
        </div>

        <div>
          <label>Jumlah</label>
          <input type="number" value="0">
        </div>

        <div>
          <label>Total</label>
          <div class="total" style="font-size:15px;padding:14px">Rp 0</div>
        </div>
      </div>

      <div class="item">
        <div>
          <b>Bubur Ayam</b><br>
          <small>Rp 12.000</small>
        </div>

        <div>
          <label>Jumlah</label>
          <input type="number" value="0">
        </div>

        <div>
          <label>Total</label>
          <div class="total" style="font-size:15px;padding:14px">Rp 0</div>
        </div>
      </div>

    </div>

    <div class="card">
      <h2>Total Semua</h2>

      <div class="total">
        Rp 0
      </div>

      <button class="primary">Simpan Laporan</button>
      <button class="green">Kirim WhatsApp</button>
    </div>

  </section>

  <!-- HARIAN -->
  <section class="page" id="harianPage">
    <div class="card">
      <h2>Laporan Harian</h2>

      <label>Pilih Tanggal</label>
      <input type="date">

      <button class="primary">Tampilkan</button>
      <button class="red">Hapus Data</button>
    </div>
  </section>

  <!-- BULANAN -->
  <section class="page" id="bulananPage">
    <div class="card">
      <h2>Laporan Bulanan</h2>

      <label>Pilih Bulan</label>
      <input type="month">

      <button class="primary">Tampilkan Rekap</button>
      <button class="red">Hapus Data Bulan Ini</button>
    </div>
  </section>

  <!-- SETTING -->
  <section class="page" id="settingPage">
    <div class="card">
      <h2>Setting Item</h2>

      <label>Kategori</label>
      <input type="text" placeholder="Contoh: Bubur">

      <label>Nama Item</label>
      <input type="text" placeholder="Contoh: Bubur Ori">

      <label>Harga</label>
      <input type="number">

      <button class="primary">Simpan Item</button>
    </div>
  </section>

</div>

<nav class="nav">

  <button class="active" onclick="openPage('input')">
    <span class="ico">＋</span>
    Input
  </button>

  <button onclick="openPage('harian')">
    <span class="ico">◷</span>
    Harian
  </button>

  <button onclick="openPage('bulanan')">
    <span class="ico">▦</span>
    Bulanan
  </button>

  <button onclick="openPage('setting')">
    <span class="ico">⚙</span>
    Setting
  </button>

</nav>

<script>
function openPage(page){

  document.querySelectorAll(".page").forEach(el=>{
    el.classList.remove("active");
  });

  document.querySelectorAll(".nav button").forEach(el=>{
    el.classList.remove("active");
  });

  document.getElementById(page+"Page").classList.add("active");

  event.currentTarget.classList.add("active");

  const data = {
    input:{
      title:"Input Laporan",
      desc:"Catat penjualan harian dengan cepat dan profesional."
    },
    harian:{
      title:"Laporan Harian",
      desc:"Lihat laporan per tanggal dan hapus data yang tidak dibutuhkan."
    },
    bulanan:{
      title:"Laporan Bulanan",
      desc:"Rekap bulanan yang rapi dan mudah dipahami."
    },
    setting:{
      title:"Setting Item",
      desc:"Atur item dan kategori tanpa edit kode aplikasi."
    }
  };

  document.getElementById("title").innerText=data[page].title;
  document.getElementById("desc").innerText=data[page].desc;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}
</script>

</body>
</html>
