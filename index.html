<!DOCTYPE html>
<html>
<head>
  <title>Firebase Test</title>
</head>
<body>

<h2>Input Data</h2>
<input type="text" id="nama" placeholder="Nama">
<input type="number" id="jumlah" placeholder="Jumlah">
<button onclick="simpan()">Simpan</button>

<h2>Data:</h2>
<ul id="list"></ul>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGgPaeVEkv3U0pLU0eyB0gww69Cm_yAK0",
    authDomain: "bahasa-arab-90f36.firebaseapp.com",
    databaseURL: "https://bahasa-arab-90f36-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bahasa-arab-90f36",
    storageBucket: "bahasa-arab-90f36.firebasestorage.app",
    messagingSenderId: "383589687078",
    appId: "1:383589687078:web:8acad56c6e1348debe6be7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // SIMPAN DATA
  window.simpan = function() {
    const nama = document.getElementById("nama").value;
    const jumlah = document.getElementById("jumlah").value;

    set(ref(db, 'laporan/' + Date.now()), {
      nama: nama,
      jumlah: jumlah
    });
  }

  // AMBIL DATA REALTIME
  const dataRef = ref(db, 'laporan/');
  onValue(dataRef, (snapshot) => {
    const data = snapshot.val();
    const list = document.getElementById("list");
    list.innerHTML = "";

    for (let id in data) {
      list.innerHTML += `<li>${data[id].nama} - ${data[id].jumlah}</li>`;
    }
  });

</script>

</body>
</html>
