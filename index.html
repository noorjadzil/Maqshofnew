<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nozil Note</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:#07111f;color:white;min-height:100vh;padding:16px 16px 90px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-size:26px;font-weight:900}
.logo span{color:#facc15}
.btn{border:0;border-radius:16px;padding:12px 16px;background:#facc15;color:#111827;font-weight:900;text-decoration:none}
.search{width:100%;padding:15px;border-radius:18px;border:1px solid #334155;background:#0f172a;color:white;margin-bottom:12px}
.filters{display:flex;gap:8px;overflow:auto;margin-bottom:14px}
.filters button{white-space:nowrap;border:1px solid #334155;background:#0f172a;color:white;border-radius:999px;padding:9px 12px}
.grid{display:grid;gap:14px}
.card{padding:16px;border-radius:24px;box-shadow:0 14px 35px #0007;border:1px solid #334155;overflow:hidden}
.card h3{font-size:19px;margin-bottom:8px}
.card p{color:#e2e8f0;white-space:pre-wrap;line-height:1.45}
.meta{margin-top:12px;font-size:12px;color:#cbd5e1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.actions{display:flex;gap:8px;margin-top:12px}
.actions a,.actions button{flex:1;border:0;border-radius:13px;padding:10px;text-align:center;text-decoration:none;font-weight:800}
.edit{background:#38bdf8;color:#082f49}
.del{background:#ef4444;color:white}
.empty{text-align:center;margin-top:70px;color:#94a3b8;line-height:1.7}
.nav{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:10px}
.nav a{flex:1;text-align:center;background:#0f172a;color:white;border:1px solid #334155;border-radius:18px;padding:13px;text-decoration:none;font-weight:800}
.alarmBox{position:fixed;inset:0;background:#000d;display:none;z-index:99;padding:20px;align-items:center;justify-content:center}
.alarmCard{width:100%;max-width:460px;min-height:420px;border-radius:32px;padding:28px;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 30px 80px #000}
.alarmCard h1{font-size:34px;margin-bottom:16px}
.alarmCard p{font-size:23px;line-height:1.5;white-space:pre-wrap}
.alarmBtns{display:flex;gap:10px;margin-top:28px}
.alarmBtns button{flex:1;border:0;border-radius:16px;padding:14px;font-weight:900}
.done{background:#22c55e;color:#052e16}
.snooze{background:#facc15;color:#111827}
</style>
</head>
<body>

<div class="top">
  <div class="logo">Nozil <span>Note</span></div>
  <a class="btn" href="catatan.html">+ Catatan</a>
</div>

<input class="search" id="search" placeholder="Cari judul, isi, tag...">

<div class="filters">
  <button onclick="setFilter('all')">Semua</button>
  <button onclick="setFilter('pin')">📌 Pin</button>
  <button onclick="setFilter('alarm')">⏰ Alarm</button>
  <button onclick="setFilter('favorite')">⭐ Favorit</button>
  <button onclick="setFilter('archive')">Arsip</button>
</div>

<div id="list" class="grid"></div>

<div class="nav">
  <a href="index.html">Catatan</a>
  <a href="setting.html">Setting</a>
</div>

<div class="alarmBox" id="alarmBox">
  <div class="alarmCard" id="alarmCard">
    <h1 id="alarmTitle">Alarm Catatan</h1>
    <p id="alarmBody"></p>
    <div class="alarmBtns">
      <button class="snooze" onclick="snoozeAlarm()">Tunda 5 Menit</button>
      <button class="done" onclick="finishAlarm()">Selesai</button>
    </div>
  </div>
</div>

<script>
const KEY="nozil_notes_v2";
let filter="all";
let activeAlarm=null;
let audioCtx=null;
let beepTimer=null;

const list=document.getElementById("list");
const search=document.getElementById("search");

function getNotes(){
  return JSON.parse(localStorage.getItem(KEY)||"[]");
}
function saveNotes(data){
  localStorage.setItem(KEY,JSON.stringify(data));
}
function esc(s){
  return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function setFilter(v){
  filter=v;
  render();
}
function hapus(id){
  if(confirm("Hapus catatan ini?")){
    saveNotes(getNotes().filter(n=>n.id!==id));
    render();
  }
}
function bgStyle(n){
  if(n.customImage){
    return `background:linear-gradient(#0009,#0009),url(${n.customImage}) center/cover;color:white;`;
  }
  return n.bgStyle || "background:linear-gradient(135deg,#0f172a,#1e3a8a);color:white;";
}
function render(){
  const q=search.value.toLowerCase();
  let notes=getNotes().filter(n=>{
    const text=((n.title||"")+" "+(n.body||"")+" "+(n.tag||"")).toLowerCase();
    if(q && !text.includes(q)) return false;
    if(filter==="pin" && !n.pin) return false;
    if(filter==="alarm" && !n.alarmActive) return false;
    if(filter==="favorite" && !n.favorite) return false;
    if(filter==="archive" && !n.archive) return false;
    if(filter!=="archive" && n.archive) return false;
    return true;
  });

  notes.sort((a,b)=>
    (b.pin===true)-(a.pin===true) ||
    (b.favorite===true)-(a.favorite===true) ||
    (b.updated||0)-(a.updated||0)
  );

  if(notes.length===0){
    list.innerHTML='<div class="empty">Belum ada catatan.<br>Tekan + Catatan untuk mulai.</div>';
    return;
  }

  list.innerHTML=notes.map(n=>`
    <div class="card" style="${bgStyle(n)}">
      <h3>${n.pin?'📌 ':''}${n.favorite?'⭐ ':''}${esc(n.title||'Tanpa Judul')}</h3>
      <p style="font-size:${n.fontSize||18}px;color:${n.textColor||'inherit'}">${esc((n.body||'').slice(0,170))}</p>
      <div class="meta">
        <span>${n.tag?'#'+esc(n.tag):'Catatan'}</span>
        <span>${n.alarmActive?'⏰ '+esc(n.alarmTime||'Alarm aktif'):''}</span>
        <span>${new Date(n.updated||Date.now()).toLocaleDateString('id-ID')}</span>
      </div>
      <div class="actions">
        <a class="edit" href="catatan.html?id=${n.id}">Edit</a>
        <button class="del" onclick="hapus('${n.id}')">Hapus</button>
      </div>
    </div>
  `).join("");
}

search.oninput=render;
render();

function startBeep(){
  stopBeep();
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  beepTimer=setInterval(()=>{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type="sine";
    osc.frequency.value=850;
    gain.gain.value=0.12;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    setTimeout(()=>osc.stop(),450);
  },900);
}
function stopBeep(){
  if(beepTimer) clearInterval(beepTimer);
  beepTimer=null;
}
function showAlarm(note){
  activeAlarm=note;
  const box=document.getElementById("alarmBox");
  const card=document.getElementById("alarmCard");
  document.getElementById("alarmTitle").textContent=note.title||"Alarm Catatan";
  document.getElementById("alarmBody").textContent=note.body||"Catatan penting";
  card.style.cssText=bgStyle(note);
  box.style.display="flex";
  startBeep();
}
function finishAlarm(){
  stopBeep();
  document.getElementById("alarmBox").style.display="none";
  if(!activeAlarm)return;
  let notes=getNotes();
  notes=notes.map(n=>{
    if(n.id===activeAlarm.id){
      n.alarmDone=true;
      if(n.repeatAlarm==="none" || !n.repeatAlarm) n.alarmActive=false;
      if(n.repeatAlarm==="daily"){
        const d=new Date(n.alarmTime);
        d.setDate(d.getDate()+1);
        n.alarmTime=d.toISOString().slice(0,16);
      }
    }
    return n;
  });
  saveNotes(notes);
  activeAlarm=null;
  render();
}
function snoozeAlarm(){
  stopBeep();
  document.getElementById("alarmBox").style.display="none";
  if(!activeAlarm)return;
  let notes=getNotes();
  notes=notes.map(n=>{
    if(n.id===activeAlarm.id){
      const d=new Date(Date.now()+5*60*1000);
      n.alarmTime=d.toISOString().slice(0,16);
    }
    return n;
  });
  saveNotes(notes);
  activeAlarm=null;
  render();
}
function checkAlarm(){
  const now=Date.now();
  const notes=getNotes();
  const due=notes.find(n=>n.alarmActive && n.alarmTime && !n.alarmRinging && Math.abs(new Date(n.alarmTime).getTime()-now)<30000);
  if(due && !activeAlarm) showAlarm(due);
}
setInterval(checkAlarm,10000);
</script>

</body>
</html>
