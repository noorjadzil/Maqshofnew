<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MAQSHOF</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Aplikasi Laporan</p>
          <h1 id="appTitle">MAQSHOF</h1>
          <p id="appSubtitle">Input, laporan, dan pengaturan item</p>
        </div>
        <div class="logo-mark">M</div>
      </div>

      <div class="hero-stats">
        <div>
          <span>Mode</span>
          <b>Offline</b>
        </div>
        <div>
          <span>Storage</span>
          <b>IndexedDB</b>
        </div>
        <div>
          <span>Status</span>
          <b>Aman</b>
        </div>
      </div>
    </header>

    <main class="container">
      <section id="tab-input" class="tab-page active"></section>
      <section id="tab-harian" class="tab-page"></section>
      <section id="tab-bulanan" class="tab-page"></section>
      <section id="tab-setting" class="tab-page"></section>
    </main>

    <nav class="bottom-nav">
      <button class="tab-btn active" data-tab="input">
        <span>＋</span>
        <small>Input</small>
      </button>
      <button class="tab-btn" data-tab="harian">
        <span>◷</span>
        <small>Harian</small>
      </button>
      <button class="tab-btn" data-tab="bulanan">
        <span>▦</span>
        <small>Bulanan</small>
      </button>
      <button class="tab-btn" data-tab="setting">
        <span>⚙</span>
        <small>Setting</small>
      </button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
