<!DOCTYPE html>
<html>
<head>
  <title>Game Bahasa Arab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:Arial;text-align:center;">

<h2>Tebak Kata</h2>

<!-- GAMBAR -->
<img id="gambar" src="https://via.placeholder.com/150?text=KITAB" width="150">

<br><br>

<!-- PILIHAN -->
<div id="pilihan">
  <button onclick="jawab('kitab')">kitab</button>
  <button onclick="jawab('qalam')">qalam</button>
  <button onclick="jawab('kursi')">kursi</button>
  <button onclick="jawab('bab')">bab</button>
  <button onclick="jawab('bait')">bait</button>
  <button onclick="jawab('maktab')">maktab</button>
</div>

<br>

<p id="hasil"></p>
<p>Skor: <span id="skor">0</span></p>

<script>
let jawabanBenar = "kitab";
let skor = 0;

function jawab(pilihan){
  if(pilihan === jawabanBenar){
    document.getElementById("hasil").innerText = "Benar!";
    skor++;
  } else {
    document.getElementById("hasil").innerText = "Salah!";
  }

  document.getElementById("skor").innerText = skor;
}
</script>

</body>
</html>
