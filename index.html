<!DOCTYPE html>
<html>
<head>
  <title>Game Bahasa Arab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:Arial;text-align:center;">

<h2>اختر الكلمة الصحيحة</h2>

<!-- GAMBAR KITAB (AMAN) -->
<img id="gambar" 
src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Book_icon.svg/200px-Book_icon.svg.png" 
width="150">

<br><br>

<!-- PILIHAN ARAB -->
<div>
  <button onclick="jawab('كِتَابٌ')">كِتَابٌ</button>
  <button onclick="jawab('قَلَمٌ')">قَلَمٌ</button>
  <button onclick="jawab('كُرْسِيٌّ')">كُرْسِيٌّ</button>
  <button onclick="jawab('بَابٌ')">بَابٌ</button>
  <button onclick="jawab('بَيْتٌ')">بَيْتٌ</button>
  <button onclick="jawab('مَكْتَبٌ')">مَكْتَبٌ</button>
</div>

<br>

<p id="hasil"></p>
<p>Skor: <span id="skor">0</span></p>

<script>
let jawabanBenar = "كِتَابٌ";
let skor = 0;

function jawab(pilihan){
  if(pilihan === jawabanBenar){
    document.getElementById("hasil").innerText = "✔️ صحيح";
    skor++;
  } else {
    document.getElementById("hasil").innerText = "❌ خطأ";
  }

  document.getElementById("skor").innerText = skor;
}
</script>

</body>
</html>
