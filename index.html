<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MAQSHOF</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    :root {
      --navy: #0f172a;
      --blue: #1e3a8a;
      --sky: #38bdf8;
      --bg: #eef4ff;
      --card: rgba(255,255,255,.92);
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.25), transparent 34%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%) !important;
      min-height: 100vh;
      padding-bottom: 92px;
    }

    .app-header {
      display: none !important;
    }

    .tabs {
      position: fixed !important;
      left: 12px;
      right: 12px;
      bottom: 12px;
      top: auto !important;
      z-index: 50;
      max-width: 640px;
      margin: auto;
      display: grid !important;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 8px;
      border-radius: 24px;
      background: rgba(255,255,255,.86) !important;
      border: 1px solid rgba(203,213,225,.9) !important;
      box-shadow: 0 18px 44px rgba(15,23,42,.22);
      backdrop-filter: blur(18px);
    }

    .tab-btn {
      border-radius: 18px !important;
      margin: 0 !important;
      padding: 11px 4px !important;
      background: transparent !important;
      color: #64748b !important;
      font-size: 12px !important;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #1e3a8a, #2563eb) !important;
      color: white !important;
      box-shadow: 0 10px 22px rgba(37,99,235,.32);
    }

    .container {
      padding-top: 0 !important;
      max-width: 980px !important;
    }

    .hero {
      background:
        radial-gradient(circle at 85% 0%, rgba(56,189,248,.40), transparent 30%),
        linear-gradient(135deg, #0f172a 0%, #1e3a8a 58%, #2563eb 100%);
      color: white;
      padding: 22px 16px 18px;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      box-shadow: 0 18px 45px rgba(15,23,42,.26);
      margin-bottom: 16px;
    }

    .hero-inner {
      max-width: 980px;
      margin: auto;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #bfdbfe;
      font-weight: 800;
    }

    .hero h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -.04em;
      font-weight: 950;
    }

    .hero p {
      margin: 7px 0 0;
      color: #dbeafe;
      font-size: 14px;
    }

    .logo-mark {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.30);
      font-size: 26px;
      font-weight: 950;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
    }

    .hero-stats {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .hero-stats div {
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 18px;
      padding: 12px;
      backdrop-filter: blur(10px);
    }

    .hero-stats span {
      display: block;
      color: #bfdbfe;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .hero-stats b {
      font-size: 13px;
    }

    .card {
      border-radius: 22px !important;
      background: rgba(255,255,255,.94) !important;
      border: 1px solid rgba(219,228,240,.95) !important;
      box-shadow: 0 14px 35px rgba(15,23,42,.10) !important;
      backdrop-filter: blur(12px);
    }

    .card h2 {
      font-size: 19px !important;
      letter-spacing: -.02em;
    }

    input, textarea, select {
      border-radius: 15px !important;
      padding: 13px !important;
      background: #f8fafc !important;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #60a5fa !important;
      box-shadow: 0 0 0 4px rgba(96,165,250,.18) !important;
      background: white !important;
      outline: none;
    }

    button {
      border-radius: 16px !important;
      padding: 13px !important;
      font-weight: 900 !important;
    }

    .primary {
      background: linear-gradient(135deg, #1e3a8a, #2563eb) !important;
      color: white !important;
      box-shadow: 0 12px 24px rgba(37,99,235,.25);
    }

    .green {
      background: linear-gradient(135deg, #15803d, #16a34a) !important;
      color: white !important;
    }

    .red {
      background: linear-gradient(135deg, #991b1b, #dc2626) !important;
      color: white !important;
    }

    .category-title {
      background: linear-gradient(135deg, #dbeafe, #e0f2fe) !important;
      color: #1e3a8a !important;
      border-radius: 16px !important;
      padding: 12px !important;
      font-weight: 900 !important;
    }

    .item-row,
    .setting-row {
      border-radius: 18px !important;
      background: linear-gradient(180deg, #ffffff, #f8fafc) !important;
      border: 1px solid #e2e8f0 !important;
      padding: 12px !important;
      margin-bottom: 10px !important;
    }

    .total-box {
      border-radius: 20px !important;
      background:
        radial-gradient(circle at top right, rgba(56,189,248,.25), transparent 36%),
        linear-gradient(135deg, #ecfeff, #eff6ff) !important;
      font-size: 25px !important;
      color: #0f172a !important;
    }

    @media (max-width: 640px) {
      .hero h1 {
        font-size: 29px;
      }

      .hero {
        border-bottom-left-radius: 26px;
        border-bottom-right-radius: 26px;
      }
    }
  </style>
</head>

<body>
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Aplikasi Laporan</p>
          <h1 id="appTitle">MAQSHOF</h1>
          <p id="appSubtitle">Input, laporan, dan pengaturan item</p>
        </div>
        <div class="logo-mark">M</div>
      </div>

      <div class="hero-stats">
        <div>
          <span>Mode</span>
          <b>Offline</b>
        </div>
        <div>
          <span>Penyimpanan</span>
          <b>IndexedDB</b>
        </div>
        <div>
          <span>Status</span>
          <b>Siap Pakai</b>
        </div>
      </div>
    </div>
  </section>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="input">＋<br>Input</button>
    <button class="tab-btn" data-tab="harian">◷<br>Harian</button>
    <button class="tab-btn" data-tab="bulanan">▦<br>Bulanan</button>
    <button class="tab-btn" data-tab="setting">⚙<br>Setting</button>
  </nav>

  <main class="container">
    <section id="tab-input" class="tab-page active"></section>
    <section id="tab-harian" class="tab-page"></section>
    <section id="tab-bulanan" class="tab-page"></section>
    <section id="tab-setting" class="tab-page"></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
