<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input 5 - Premium</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Input 5 — Premium App</h1><p>Konsep modern dengan ringkasan kanan dan kartu elegan.</p></header><main class="wrap"><div class="grid" style="grid-template-columns:1.2fr .8fr"><section><div class="card"><div class="row"><div><label>Tanggal</label><input type="date" id="tanggal"></div><div><label>Outlet</label><input id="outlet" value="Akang Hamzah"></div></div></div><div id="area"></div></section><aside><div class="card" style="position:sticky;top:12px"><span class="pill">Live Summary</span><h2 id="brand"></h2><div class="total" id="total">Rp 0</div><textarea id="catatan" placeholder="Catatan laporan"></textarea><button class="green" onclick="simpanLaporan()">Simpan Premium</button><button class="soft" onclick="kirim()">Share WhatsApp</button></div></aside></div></main><div id="nav"></div><script src="db.js"></script><script>
let S; window.onload=async()=>{S=await getSettings(); tanggal.value=today(); brand.textContent=S.brand; document.getElementById('nav').innerHTML=nav('input').replaceAll('Input2','Input5').replaceAll('laporan2','laporan5').replaceAll('setting2','setting5'); render();};
function render(){area.innerHTML=['produk','extra','minuman'].map(k=>`<div class="card"><div class="section-title"><h2>${k}</h2><span class="pill">${activeItems(S,k).length} item</span></div><div class="grid">${activeItems(S,k).map((x,i)=>`<div style="border:1px solid var(--line);border-radius:20px;padding:12px;background:linear-gradient(180deg,#fff,#f8fafc)"><b>${x.nama}</b><div class="muted">${rupiah(x.harga)}</div><input id="${k}_${i}" type="range" min="0" max="50" value="0" oninput="document.getElementById('v_${k}_${i}').textContent=this.value;hitung()"><div class="section-title"><span class="pill">Jumlah <b id="v_${k}_${i}">0</b></span><input style="max-width:90px" type="number" min="0" value="0" oninput="document.getElementById('${k}_${i}').value=this.value;document.getElementById('v_${k}_${i}').textContent=this.value;hitung()"></div></div>`).join('')}</div></div>`).join(''); hitung()}
function kumpul(){let data={tanggal:tanggal.value,outlet:outlet.value,catatan:catatan.value,konsep:'Input5'}; ['produk','extra','minuman'].forEach(k=>data[k]=activeItems(S,k).map((x,i)=>({...x,jumlah:Number(document.getElementById(`${k}_${i}`)?.value||0)}))); data.stok=[]; data.cekBarang=[]; return calcReport(data)}
function hitung(){total.innerText=rupiah(kumpul().total)} async function simpanLaporan(){await saveReport(kumpul()); alert('Tersimpan')} function kirim(){openWA(kumpul(),S)}
</script></body></html>
