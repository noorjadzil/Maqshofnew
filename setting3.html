<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setting 3 - Kanban</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Setting 3 — Kanban Kategori</h1><p>Konsep kartu item. Bisa naik-turun urutan.</p></header><main class="wrap"><div id="area"></div></main><div id="nav"></div><script src="db.js"></script><script>
let S; window.onload=async()=>{S=await getSettings(); document.getElementById('nav').innerHTML=nav('setting').replaceAll('Input2','Input3').replaceAll('laporan2','laporan3').replaceAll('setting2','setting3'); render()};
function render(){area.innerHTML=`<div class="card row"><input id="brand" value="${S.brand}"><input id="wa" placeholder="WA" value="${S.wa||''}"><button class="green" onclick="save()">Simpan</button></div><div class="grid">`+['produk','extra','minuman'].map(k=>`<div class="card"><h2>${k}</h2><button class="soft mini" onclick="add('${k}')">+ Item</button>${S[k].map((x,i)=>`<div class="card" style="margin:10px 0;background:#f8fafc"><input id="${k}_n_${i}" value="${x.nama}"><input id="${k}_h_${i}" type="number" value="${x.harga}"><div class="row"><button class="ghost mini" onclick="move('${k}',${i},-1)">↑</button><button class="ghost mini" onclick="move('${k}',${i},1)">↓</button><button class="red mini" onclick="del('${k}',${i})">Hapus</button></div></div>`).join('')}</div>`).join('')+'</div>'}
function add(k){S[k].push({nama:'Baru',harga:0,aktif:true});render()} function del(k,i){S[k].splice(i,1);render()} function move(k,i,d){let j=i+d;if(j<0||j>=S[k].length)return;[S[k][i],S[k][j]]=[S[k][j],S[k][i]];render()} async function save(){S.brand=brand.value;S.wa=wa.value; ['produk','extra','minuman'].forEach(k=>S[k]=S[k].map((x,i)=>({nama:document.getElementById(`${k}_n_${i}`).value,harga:Number(document.getElementById(`${k}_h_${i}`).value||0),aktif:true}))); await saveSettings(S);alert('Tersimpan')}
</script></body></html>
