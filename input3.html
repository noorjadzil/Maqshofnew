<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Input 3 - Kasir Cepat</title>
<link rel="stylesheet" href="style.css">

<style>
.tab-wrap{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
padding:0 0 10px;
margin-bottom:14px;
width:100%;
}

.tab-wrap button{
width:100%;
min-width:0;
white-space:normal;
font-size:13px;
padding:10px 6px;
line-height:1.2;
text-align:center;
}
.tab-page{
animation:fade .2s ease;
}
@keyframes fade{
from{opacity:.5;transform:translateY(6px)}
to{opacity:1;transform:none}
}
.qty-box{
margin-top:8px;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
}
.qty-btn{
border:0;
border-radius:12px;
padding:8px 12px;
font-weight:800;
cursor:pointer;
}
.qty-number{
font-size:18px;
font-weight:900;
}
  .menu-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.menu-grid button{
padding:10px !important;
border-radius:16px;
}

.menu-grid b{
font-size:14px;
display:block;
margin-bottom:4px;
line-height:1.2;
}

.menu-grid .muted{
font-size:12px;
}

.menu-grid .pill{
font-size:12px;
padding:4px 8px;
}
</style>
</head>

<body>

<header class="hero">
<h1>Input 3 — Kasir Cepat</h1>
<p>Konsep tombol besar. Cocok saat antrean ramai.</p>
</header>

<main class="wrap">

<div class="card">
  <div class="row">
    <input type="date" id="tanggal">
    <input id="catatan" placeholder="Catatan singkat">
  </div>

  <div class="section-title">
    <span class="pill">Mode cepat</span>
    <div class="total" id="total">Rp 0</div>
  </div>
</div>

<div id="area"></div>

<div class="card">
  <button class="green" onclick="simpanLaporan()">Simpan Laporan</button>
  <button class="soft" onclick="kirim()">Kirim WhatsApp</button>
  <button class="ghost" onclick="resetQty()">Kosongkan Qty</button>
</div>

</main>

<div id="nav"></div>

<script src="db.js"></script>

<script>
let S;
let currentTab = 'produk';

let qty = {
  produk: [],
  extra: [],
  minuman: []
};

window.onload = async () => {
  S = await getSettings();

  tanggal.value = today();

  document.getElementById('nav').innerHTML =
    nav('input')
    .replaceAll('Input2','Input3')
    .replaceAll('laporan2','laporan3')
    .replaceAll('setting2','setting3');

  initQty();
  render();
};

function initQty(){
  ['produk','extra','minuman'].forEach(k=>{
    qty[k] = activeItems(S,k).map(()=>0);
  });
}

function render(){

  const tabs = [
    {id:'produk', nama:'Menu Bubur'},
    {id:'extra', nama:'Extra Topping'},
    {id:'minuman', nama:'Minuman'}
  ];

  area.innerHTML = `

    <div class="tab-wrap">
      ${tabs.map(t=>`
        <button 
          class="${currentTab===t.id?'green':'ghost'}"
          onclick="gantiTab('${t.id}')">
          ${t.nama}
        </button>
      `).join('')}
    </div>

    <div class="tab-page">
      <div class="card">
        <h2>${tabs.find(t=>t.id===currentTab).nama}</h2>

        <div class="grid menu-grid">
          ${activeItems(S,currentTab).map((x,i)=>`
            <button 
              class="ghost"
              style="text-align:left;padding:16px"
              onclick="add('${currentTab}',${i})">

              <b>${x.nama}</b><br>

              <span class="muted">
                ${rupiah(x.harga)}
              </span>

              <div class="pill" style="margin-top:8px">
                Qty: 
                <span id="q_${currentTab}_${i}">
                  ${qty[currentTab][i] || 0}
                </span>
              </div>

            </button>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Stok Ringkas</h2>
      <div class="grid">
        ${(S.stok||[]).map((n,i)=>`
          <label>
            ${n}
            <input id="stok_${i}" type="number" placeholder="Sisa">
          </label>
        `).join('')}
      </div>
    </div>

  `;

  hitung();
}

function gantiTab(x){
  currentTab = x;
  render();
}

function add(k,i){
  qty[k][i] = Number(qty[k][i] || 0) + 1;

  const el = document.getElementById(`q_${k}_${i}`);
  if(el) el.textContent = qty[k][i];

  hitung();
}

function resetQty(){
  ['produk','extra','minuman'].forEach(k=>{
    qty[k] = qty[k].map(()=>0);
  });

  render();
  hitung();
}

function kumpul(){

  let data = {
    tanggal: tanggal.value,
    catatan: catatan.value,
    konsep: 'Input3'
  };

  ['produk','extra','minuman'].forEach(k=>{
    data[k] = activeItems(S,k).map((x,i)=>({
      ...x,
      jumlah: Number(qty[k][i] || 0)
    }));
  });

  data.stok = (S.stok||[]).map((n,i)=>({
    nama: n,
    sisa: Number(document.getElementById(`stok_${i}`)?.value || 0)
  }));

  data.cekBarang = [];

  return calcReport(data);
}

function hitung(){
  total.innerText = rupiah(kumpul().total);
}

async function simpanLaporan(){
  await saveReport(kumpul());
  alert('Tersimpan');
}

function kirim(){
  openWA(kumpul(),S);
}
</script>

</body>
</html>
