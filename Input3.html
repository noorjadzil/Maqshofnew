<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input 3 - Kasir Cepat</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Input 3 — Kasir Cepat</h1><p>Konsep tombol besar. Cocok saat antrean ramai.</p></header><main class="wrap">
<div class="card"><div class="row"><input type="date" id="tanggal"><input id="catatan" placeholder="Catatan singkat"></div><div class="section-title"><span class="pill">Mode cepat</span><div class="total" id="total">Rp 0</div></div></div><div id="area"></div><div class="card"><button class="green" onclick="simpanLaporan()">Simpan Laporan</button><button class="soft" onclick="kirim()">Kirim WhatsApp</button><button class="ghost" onclick="resetQty()">Kosongkan Qty</button></div></main><div id="nav"></div><script src="db.js"></script><script>
let S; window.onload=async()=>{S=await getSettings(); tanggal.value=today(); document.getElementById('nav').innerHTML=nav('input').replaceAll('Input2','Input3').replaceAll('laporan2','laporan3').replaceAll('setting2','setting3'); render();};
function render(){area.innerHTML=['produk','extra','minuman'].map(k=>`<div class="card"><h2>${k==='produk'?'Menu Bubur':k==='extra'?'Extra Topping':'Minuman'}</h2><div class="grid">${activeItems(S,k).map((x,i)=>`<button class="ghost" style="text-align:left;padding:16px" onclick="add('${k}',${i})"><b>${x.nama}</b><br><span class="muted">${rupiah(x.harga)}</span><div class="pill" style="margin-top:8px">Qty: <span id="q_${k}_${i}">0</span></div></button>`).join('')}</div></div>`).join('')+`<div class="card"><h2>Stok Ringkas</h2><div class="grid">${(S.stok||[]).map((n,i)=>`<label>${n}<input id="stok_${i}" type="number" placeholder="Sisa"></label>`).join('')}</div></div>`; hitung()}
function add(k,i){let e=document.getElementById(`q_${k}_${i}`); e.textContent=Number(e.textContent||0)+1; hitung()}
function resetQty(){document.querySelectorAll('[id^=q_]').forEach(e=>e.textContent=0); hitung()}
function kumpul(){let data={tanggal:tanggal.value,catatan:catatan.value,konsep:'Input3'}; ['produk','extra','minuman'].forEach(k=>data[k]=activeItems(S,k).map((x,i)=>({...x,jumlah:Number(document.getElementById(`q_${k}_${i}`)?.textContent||0)}))); data.stok=(S.stok||[]).map((n,i)=>({nama:n,sisa:Number(document.getElementById(`stok_${i}`)?.value||0)})); data.cekBarang=[]; return calcReport(data)}
function hitung(){total.innerText=rupiah(kumpul().total)} async function simpanLaporan(){await saveReport(kumpul()); alert('Tersimpan')} function kirim(){openWA(kumpul(),S)}
</script></body></html>
